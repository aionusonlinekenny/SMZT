<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
    <head>
        <meta name="renderer" content="webkit">
        <title>神魔乱舞</title>
        <meta name="google" value="notranslate" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <style type="text/css" media="screen">
            html, body  { height:100%; }
            body { margin:0; padding:0; overflow:auto; text-align:center;
                   background-color: #000000; }
            object:focus { outline:none; }
            #ruffleContainer { width:100%; height:100%; position:absolute; top:0; left:0; }
        </style>

        <!-- Ruffle: Flash emulator for modern browsers (no Flash plugin needed) -->
        <script>
            window.RufflePlayer = window.RufflePlayer || {};
        </script>
        <script src="ruffle/ruffle.js"></script>

        <script type="text/javascript" src="swfobject.js?v=0.1"></script>
        <script type="text/javascript" src="js/gameUtil.js?v=0.1"></script>
        <script type="text/javascript">
            var swfVersionStr = "11.4.0";
            var xiSwfUrlStr = "expressInstall.swf";
            var flashvars = {
				curUrl:window.location.href
			};
			var swf;
			var callFn = function callFn(callbackObj)
			{
				swf = callbackObj.ref;
			}

			if(!flashvars['serverIp'])
			{
				var hrefstr = flashvars.curUrl;
				var pos = hrefstr.indexOf("?");
				var hrefstrHead = hrefstr.substring(0, pos + 1);
				var hrefstrParam = hrefstr.substring(pos + 1);
				var hrefstrParamArr = hrefstrParam.split("&");
				var prameArr = [];
				var varStr = hrefstrHead;
				var vars = {};
				var j = 0;
				for(i = 0; i< hrefstrParamArr.length; i++)
				{
					tempstr = hrefstrParamArr[i];
					pos = tempstr.indexOf("=");
					if(pos > 0)
					{
						if(!vars[tmpstr2])
						{
							vars[tmpstr2] = true;
							var tmpstr2 = tempstr.substring(0,pos);
							flashvars[tmpstr2] = tempstr.substring(pos+1);

							if(j != 0) varStr += "&";
							varStr += tempstr;
							j++;
						}
					}
				}
			}

			var swfWidth = "100%";
			var swfHeight = "100%";
			var params = {};
			params.quality = "high";
			params.bgcolor = "#000000";
			params.allowscriptaccess = "always";
			params.allowfullscreen = "true";
			params.allowFullScreenInteractive = "true";
			params.wmode = "direct";
			var attributes = {};
			attributes.id = "Preloading";
			attributes.name = "Preloading";
			attributes.align = "middle";
			flashvars.curUrl = escape(flashvars.curUrl);

			if(flashvars["openid"] && flashvars["openid"] && flashvars["pfkey"])
			{
				this.appid = '1106083116';
				this.openid = flashvars["openid"];
				this.openkey = flashvars["openkey"];
				this.pf = flashvars["pf"];
				this.pfkey = flashvars["pfkey"];
				var qqjs = "js/qqext.js"+"?r="+(new Date()).getTime();
				var qqcs = "css/qqstyle.css"+"?r="+(new Date()).getTime();

				document.write('<scr'+'ipt type="text/javascript" src="http://fusion.qq.com/fusion_loader?appid='+this.appid+'&platform='+flashvars["pf"]+'"></scr'+'ipt>');
				document.write('<scr'+'ipt type="text/javascript" src="'+qqjs+'"></scr'+'ipt>');
				document.write('<link type="text/css" rel="stylesheet" href="'+qqcs+'"></link>');

				if(flashvars["pf"] == "qqgame")
				{
					document.write('<scr'+'ipt src="http://qqgameplatcdn.qq.com/social_hall/js/jquery.js" type="text/javascript"></scr'+'ipt>');
					document.write('<scr'+'ipt src="http://qqgameplatcdn.qq.com/social_hall/js/jquery.pm.js" type="text/javascript"></scr'+'ipt>');
					document.write('<scr'+'ipt src="http://qqgameplatcdn.qq.com/social_hall/app_frame/qqgamelib.js" type="text/javascript"></scr'+'ipt>');
				}

				swfHeight = "97%";
			}
			if(!flashvars.hasOwnProperty("b")){
				flashvars["b"] = 11;
			}

			var prFile = "Preloading.swf?b=2860?b=2505";
			if(prFile.indexOf("?b=") == -1)
			{
				prFile+="?b="+(new Date()).getTime();
			}

            // Check if native Flash plugin is available
            var hasFlash = (function(){
                try {
                    return !!(new ActiveXObject('ShockwaveFlash.ShockwaveFlash'));
                } catch(e) {
                    return navigator.plugins && !!navigator.plugins['Shockwave Flash'];
                }
            })();

            if (hasFlash) {
                // Use native Flash plugin via swfobject
                swfobject.embedSWF(prFile, "flashContent", swfWidth, swfHeight, swfVersionStr, xiSwfUrlStr, flashvars, params, attributes, callFn);
            } else {
                // Use Ruffle emulator
                window.addEventListener("load", function() {
                    var ruffle = window.RufflePlayer.newest();
                    if (!ruffle) {
                        document.getElementById("flashContent").innerHTML =
                            "<H1 style='color:#fff'>Ruffle 未加载，请检查 ruffle/ruffle.js 文件是否存在。</H1>" +
                            "<p style='color:#aaa'>请将 Ruffle 文件放入 SMZT/ruffle/ 目录后刷新。</p>";
                        return;
                    }
                    var container = document.createElement("div");
                    container.id = "ruffleContainer";
                    document.getElementById("flashContent").replaceWith(container);

                    var player = ruffle.createPlayer();
                    player.style.width = "100%";
                    player.style.height = "100%";
                    container.appendChild(player);

                    // Build flashvars string for Ruffle
                    var fvParams = {};
                    for (var k in flashvars) {
                        if (flashvars.hasOwnProperty(k)) fvParams[k] = flashvars[k];
                    }

                    player.load({
                        url: prFile,
                        parameters: fvParams,
                        backgroundColor: "#000000",
                        allowScriptAccess: "always",
                        quality: "high"
                    });
                    swf = player;
                });
            }

			function callASCloseBefore()
			{
				try
				{
					return swf.getLeaveBefore();
			　　}
				catch(error)
				{
					return "您今日还有许多精彩未能继续：" + "\n\n" +"神魔乱舞需要您的参与才更完美！确定离开此页吗？";
				}
			}

			function exitGame(){
				try
				{
					return swf.exitGame();
			　　}
				catch(error)
				{
					return "您今日还有许多精彩未能继续：" + "\n\n" +"神魔乱舞需要您的参与才更完美！确定离开此页吗？";
				}
			}
		</script>
    </head>
    <body onbeforeunload="return callASCloseBefore()" onunload="exitGame()"  scroll="no">
        <div id="flashContent">
			<H1 style="color:#fff">正在加载游戏...</H1>
        </div>
		<div id="headDiv" >
				<div class="openid">&nbsp;&nbsp;若您在游戏中遇到问题请咨询客服&nbsp;</div>
		</div>
		<script type="text/javascript">
			if(flashvars["openid"] && flashvars["openkey"] && flashvars["pfkey"] )
			{
				document.getElementById("headDiv").style.display="";
			}else
			{
				document.getElementById("headDiv").style.display="none";
			}
		</script>
   </body>
</html>
