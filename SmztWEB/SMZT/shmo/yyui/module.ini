<root>
	<!-- 模块定位类	layout
		 * 所有模块定位都是相对与中心点的
		 * 1 = 绝对定位，靠右设置XY坐标
		 * 2 = 居中
		 * 3 = 居中,靠左
		 * 4 = 居中,靠右
		 * 5 = 居中,靠上
		 * 6 = 居中,靠下
		 * 7 = 居中,可设置X Y偏移量
		 * 8 = 顶置，可设置X Y偏移量
		 * 9 = 置底，可设置X Y偏移量
		 * 10 = 靠左，可设置X Y偏移量
		 * 11 = 靠右，可设置X Y偏移量
		 * 12 = 右上，可设置X Y偏移量
		 * 13 = 右下，可设置X Y偏移量
		 * 14 = 左上，可设置X Y偏移量
		 * 15 = 左下，可设置X Y偏移量
		 * 16 = 自己手动设置位置
		 * 17 = 鼠标位置，类似tips-->
	<!-- 相对中心的偏移量（仅再可设置偏移量的LAYOUT时使用）	---------offsetX,offsetY -->
	<!-- playShowEffect是否播放显示特效 默认播放 showBottom是否显示在最底层-->
	<!-- type 1:模块  2：POP弹出界面-->
	<!-- layer UI层级 0:最底层 1:模块第一层  2：模块第二层  3：POP弹出第一层  4：POP弹出第二层-->
